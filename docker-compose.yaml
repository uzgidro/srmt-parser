services:
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: supersecret
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network

  app:
    build: .
    container_name: srmt-parse
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - app-network
    depends_on:
      - minio

networks:
  app-network:
    driver: bridge

volumes:
  minio_data:
